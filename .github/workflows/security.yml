name: security-audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly so we catch newly-disclosed CVEs in dependencies.
    - cron: '0 6 * * 1'

jobs:
  # ─── Backend dependency audit ─────────────────────────────────────────
  pnpm-audit-backend:
    name: pnpm audit (backend)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (high+critical only)
        run: pnpm audit --prod --audit-level=high

  # ─── Frontend dependency audit ────────────────────────────────────────
  pnpm-audit-frontend:
    name: pnpm audit (frontend)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  # ─── Static analysis: secrets / weak patterns ─────────────────────────
  gitleaks:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── CodeQL: JS security analysis ─────────────────────────────────────
  codeql:
    name: codeql (javascript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  # ─── Pen-test smoke: ZAP baseline against running app ─────────────────
  zap-baseline:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    needs: [pnpm-audit-backend, pnpm-audit-frontend]
    services: {}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm', cache-dependency-path: backend/pnpm-lock.yaml }

      - name: Install backend deps
        run: cd backend && pnpm install --frozen-lockfile

      - name: Generate ephemeral .env
        working-directory: ./backend
        run: |
          cp .env.example .env
          JWT_SECRET=$(node -e "console.log(require('crypto').randomBytes(48).toString('hex'))")
          PWHASH=$(node -e "console.log(require('bcryptjs').hashSync('CIPassword!2026', 12))")
          sed -i "s|JWT_SECRET=.*|JWT_SECRET=${JWT_SECRET}|" .env
          sed -i "s|ADMIN_USERNAME=.*|ADMIN_USERNAME=admin|" .env
          sed -i "s|ADMIN_PASSWORD_HASH=.*|ADMIN_PASSWORD_HASH=${PWHASH}|" .env

      - name: Start server
        working-directory: ./backend
        run: |
          node server.js &
          echo $! > server.pid
          for i in {1..20}; do
            curl -fsS http://localhost:9000/api/health && break
            sleep 1
          done

      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: 'http://localhost:9000'
          rules_file_name: 'security/zap-rules.tsv'
          allow_issue_writing: false
          fail_action: false

      - name: Stop server
        if: always()
        working-directory: ./backend
        run: kill $(cat server.pid) || true
