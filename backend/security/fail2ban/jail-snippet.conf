# Example fail2ban jail snippet for RadFast Admin.
# Append to /etc/fail2ban/jail.local then: systemctl reload fail2ban

[radfast-admin]
enabled  = true
filter   = radfast-admin
logpath  = /opt/radfast-admin/backend/data/logs/audit-*.log
maxretry = 8
findtime = 600
bantime  = 3600
action   = iptables-multiport[name=radfast, port="80,443,9000"]
