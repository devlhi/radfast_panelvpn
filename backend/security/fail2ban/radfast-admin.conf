# Fail2ban filter for RadFast Admin audit log
# Place this file at: /etc/fail2ban/filter.d/radfast-admin.conf
#
# Detects login failures + 2FA verification failures + token-rejected events
# from the JSON-lines audit log produced by lib/audit.js.
#
# Each event line looks like:
# {"ts":"2026-05-24T...","type":"login.failure","ip":"1.2.3.4",...}
#
# Usage in jail.local:
#
#   [radfast-admin]
#   enabled = true
#   filter  = radfast-admin
#   logpath = /opt/radfast-admin/backend/data/logs/audit-*.log
#   maxretry = 5
#   findtime = 600
#   bantime  = 3600
#   action   = iptables-multiport[name=radfast, port="80,443,9000"]
#

[Definition]

# Match types: login.failure, 2fa.verify_fail, auth.token_rejected, login.locked
failregex = ^.*"type":"(login\.failure|2fa\.verify_fail|auth\.token_rejected|login\.locked|auth\.token_revoked_attempt|ratelimit\.hit)".*"ip":"<HOST>".*$

ignoreregex =

# datepattern hint for fail2ban; ISO-8601 ts in JSON line
datepattern = "ts":"%%Y-%%m-%%dT%%H:%%M:%%S
